<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Danh sách Sinh viên</h2>

    <div class="input-group">
        <input type="text" id="txtName" placeholder="Họ tên sinh viên">
        <input type="number" id="txtScore" placeholder="Điểm (0-10)" step="0.1" min="0" max="10">
        <button id="btnAdd">Thêm</button>
    </div>

    <div class="filter-group">
        <input type="text" id="txtSearch" placeholder="Tìm kiếm theo tên...">
        <select id="selRank">
            <option value="all">Tất cả xếp loại</option>
            <option value="Giỏi">Giỏi</option>
            <option value="Khá">Khá</option>
            <option value="Trung bình">Trung bình</option>
            <option value="Yếu">Yếu</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th>STT</th>
                <th>Họ tên</th>
                <th id="colScore" style="cursor: pointer;">Điểm <span id="sortIcon">↕</span></th>
                <th>Xếp loại</th>
                <th>Thao tác</th>
            </tr>
        </thead>
        <tbody id="studentTableBody"></tbody>
    </table>

    <div class="statistics" id="statsBoard">
        Tổng số sinh viên: 0 | Điểm trung bình: 0.0
    </div>
    
    <script src="script.js"></script>
</body>
</html>
