<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conference Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container header-content">
            <div class="logo">Conference Management</div>
           
            <div class="search-box">
                <input type="text" placeholder="Quick search...">
            </div>

             <nav>
                <a href="#">Home</a>
                <a href="#">List</a>
                <a href="#">Add new</a>
                <a href="#">About</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="table-header">
            <div>
                <h1>Conference dashboard</h1>
                <p>Track shedules, speakers, and venus</p>
            </div>
            <div class="n2">
                <div class="form-group">
                    <label class="n3">Filter list</label>
                    <input type="text" placeholder="Type to filter table...">
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <select>
                        <option value="2">All</option>
                        <option value="1">no all</option>
                    </select>
                </div>

                <button id="btnOpenModal" class="btn-add">+ Add new</button>
            </div>
        </div>

        <table id="employeeTable">
            <thead>
                <tr>
                    <th>Conference Name</th>
                    <th>Speakers</th>
                    <th>Email</th>
                    <th>Date</th>
                    <th>Location</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </main>

    <div id="employeeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add new Conference</h3>
                <span class="close-btn">x</span>
            </div>
            <form id="employeeForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Conference name</label>
                        <input type="text" id="conName" placeholder="Event title">
                        <span class="error" id="errConName"></span>
                    </div>
                    <div class="form-group">
                        <label>Speakers</label>
                        <input type="text" id="speakers" placeholder="Speakers name">
                        <span class="error" id="errSpeakers"></span>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="text" id="email" placeholder="Nhập số điện thoại">
                        <span class="error" id="errEmail"></span>
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="date">
                        <span class="error" id="errDate"></span>
                    </div>
                </div>
                <div class="form-group">
                        <label>Location</label>
                        <input type="text" id="location">
                        <span class="error" id="errLocation"></span>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn-save">Save</button>
                    <button type="button" class="btn-cancel" id="btnCancel">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="data.js"></script>
</body>
</html>
